
name: Synthetic Windows x64 FFmpeg C ABI link probe

'on':
  workflow_dispatch:
    inputs:
      confirm_one_run:
        description: 'Explicitly approve one synthetic compile/link attempt; generated EXE will not run'
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: one-synthetic-abi-probe
  cancel-in-progress: false

jobs:
  abi:
    if: >-
      inputs.confirm_one_run == true &&
      github.repository == 'Hw7668/win64-ffmpeg-abi-probe-20261019' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Fixed-hash synthetic ABI compile and PE inspection, no EXE execution
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          MiB = 1024 * 1024
          llvm_url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip'
          llvm_sha = '1BCF74D06B724AEECAA6412CA85F5B26FB1DA770E7CDCEFA9263C9C5C3AD34B6'
          sdk_url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build-shared.7z'
          sdk_sha = '4D2060A8B34A940AA47D785142055BB92A63053781E55F2ACE4546EDD519A8F5'
          sdk_folder = 'ffmpeg-9.0.2-full_build-shared'
          llvm_folder = 'llvm-mingw-20260908-ucrt-x86_64'
          pins = {
              'include/libavformat/avio.h': '30312971FC299E65BC69CF1BEDDB76F50394E044D9C71FE32FEC3AE9C13BD1AF',
              'include/libavcodec/avcodec.h': '324452903F0D3B4BB4078652CA32C9CA29D7B3DB5E005E1AF04487409BD3090D',
              'lib/libavformat.dll.a': '963F2F0D06F60AE243DB41DB5189EA163C9D295C4E408886CF82B54F0D0C5C04',
              'lib/libavcodec.dll.a': 'B3715CD6C92CEDBA4CE36EEC9E477A971C359A6FAE6C65A15AE9CDBDB19981B1',
          }
          deadline = time.monotonic() + 900
          stage = 'preflight'
          root = None
          last_process_status = 'NOT_ATTEMPTED'

          def require(value):
              if not value:
                  raise RuntimeError('closed-guard')

          def seconds_left():
              remain = deadline - time.monotonic()
              require(remain > 0)
              return remain

          def normal_object(path):
              statinfo = path.lstat()
              require(not stat.S_ISLNK(statinfo.st_mode))
              require(not (getattr(statinfo, 'st_file_attributes', 0) & 0x400))
              require(len(str(path)) <= 240)

          def safe_member(name):
              require(isinstance(name, str) and 0 < len(name) <= 180)
              require('\\' not in name and not name.startswith('/'))
              name = name.removesuffix('/')
              parts = name.split('/')
              forbidden = {'CON', 'PRN', 'AUX', 'NUL', 'CLOCK$',
                           *(f'COM{i}' for i in range(10)),
                           *(f'LPT{i}' for i in range(10))}
              for part in parts:
                  require(re.fullmatch(r'[A-Za-z0-9_+.-]+', part) is not None)
                  require(part not in ('.', '..') and not part.endswith(('.', ' ')))
                  require(part.split('.')[0].upper() not in forbidden)
              return '/'.join(parts)

          def bounded_download(url, sha, size, path):
              require(not path.exists())
              h = hashlib.sha256()
              count = 0
              with urllib.request.urlopen(url, timeout=25) as response, path.open('xb') as out:
                  require(response.status == 200)
                  require(urllib.parse.urlparse(response.geturl()).hostname in {
                      'github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com'
                  })
                  while True:
                      seconds_left()
                      chunk = response.read(MiB)
                      if not chunk:
                          break
                      require(count + len(chunk) <= size)
                      count += len(chunk)
                      h.update(chunk)
                      require(out.write(chunk) == len(chunk))
              require(count == size and h.hexdigest().upper() == sha)
              normal_object(path)
              return path

          def terminate_family(proc):
              # Best effort for individual subprocesses; GitHub owns VM/job lifetime.
              if proc.poll() is None:
                  try:
                      taskkill = Path(os.environ['SystemRoot']) / 'System32' / 'taskkill.exe'
                      subprocess.run([str(taskkill), '/PID', str(proc.pid), '/T', '/F'],
                                     stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL, timeout=7, check=False,
                                     creationflags=subprocess.CREATE_NO_WINDOW)
                  except Exception:
                      pass
                  if proc.poll() is None:
                      try:
                          proc.kill()
                      except Exception:
                          pass

          def cmd(argv, environment, timeout=100, cap=4 * MiB):
              global last_process_status
              last_process_status = 'STARTED'
              require(root is not None)
              duration = min(timeout, seconds_left())
              process = subprocess.Popen([str(v) for v in argv], cwd=str(root),
                                         env=environment, shell=False,
                                         stdin=subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         creationflags=subprocess.CREATE_NO_WINDOW)
              captured = bytearray()
              overflow = threading.Event()
              reader_failure = threading.Event()

              def copy_stdout():
                  try:
                      while True:
                          piece = process.stdout.read(64 * 1024)
                          if not piece:
                              break
                          if len(captured) + len(piece) > cap:
                              overflow.set()
                          elif not overflow.is_set():
                              captured.extend(piece)
                  except Exception:
                      reader_failure.set()

              t = threading.Thread(target=copy_stdout, daemon=True)
              t.start()
              expired = False
              try:
                  process.wait(timeout=duration)
              except subprocess.TimeoutExpired:
                  expired = True
              finally:
                  if expired or process.poll() is None:
                      terminate_family(process)
                  try:
                      process.wait(timeout=7)
                  except subprocess.TimeoutExpired:
                      terminate_family(process)
                  t.join(timeout=7)
                  if t.is_alive():
                      terminate_family(process)
                  try:
                      process.stdout.close()
                  except Exception:
                      pass
              if expired or t.is_alive():
                  last_process_status = 'TIMEOUT_OR_UNREAPED_PIPE'
                  raise RuntimeError('subprocess-timeout')
              if overflow.is_set() or reader_failure.is_set():
                  last_process_status = 'OUTPUT_BOUNDARY'
                  raise RuntimeError('subprocess-output')
              if process.returncode != 0:
                  diagnostic = bytes(captured).decode('utf-8', 'replace').lower()
                  if 'undefined reference' in diagnostic or 'undefined symbol' in diagnostic:
                      last_process_status = 'UNRESOLVED_LINK_SYMBOL'
                  elif 'no such file' in diagnostic or 'file not found' in diagnostic:
                      last_process_status = 'MISSING_DEPENDENCY'
                  elif 'fatal error' in diagnostic:
                      last_process_status = 'COMPILER_DIAGNOSTIC'
                  else:
                      last_process_status = 'EXIT_NONZERO'
                  raise RuntimeError('subprocess-failed')
              last_process_status = 'EXIT_ZERO'
              seconds_left()
              return bytes(captured)

          try:
              stage = 'identity-and-runner-preflight'
              require(os.name == 'nt')
              require(os.environ.get('GITHUB_REPOSITORY') == 'Hw7668/win64-ffmpeg-abi-probe-20261019')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch')
              require(os.environ.get('GITHUB_REF') == 'refs/heads/main')
              require(os.environ.get('GITHUB_RUN_NUMBER') == '1')
              require(os.environ.get('GITHUB_RUN_ATTEMPT') == '1')
              temp = Path(os.path.abspath(os.environ['RUNNER_TEMP']))
              for p in (temp, *temp.parents):
                  normal_object(p)
                  require(p.is_dir())
              require(shutil.disk_usage(temp).free >= 5 * 1024 * MiB)
              root = Path(tempfile.mkdtemp(prefix='abi-', dir=str(temp)))
              normal_object(root)
              scratch = root / 'tmp'
              scratch.mkdir()
              seven = Path(os.environ['ProgramFiles']) / '7-Zip' / '7z.exe'
              normal_object(seven)
              require(seven.is_file())
              child_env = dict(os.environ)
              child_env.update({'TEMP': str(scratch), 'TMP': str(scratch), 'TMPDIR': str(scratch)})
              child_env.pop('GITHUB_TOKEN', None)

              stage = 'download-fixed-assets'
              llvm = bounded_download(llvm_url, llvm_sha, 190677197, root / 'llvm.zip')
              sdk = bounded_download(sdk_url, sdk_sha, 59758994, root / 'sdk.7z')

              stage = 'llvm-zip-member-preflight'
              tools = root / 'tools'
              tools.mkdir()
              with zipfile.ZipFile(llvm) as z:
                  entries = z.infolist()
                  require(len(entries) == 9299)
                  names, files, total = set(), set(), 0
                  for entry in entries:
                      n = safe_member(entry.filename)
                      lower = n.casefold()
                      require(lower not in names)
                      names.add(lower)
                      mode = stat.S_IFMT(entry.external_attr >> 16)
                      require(mode in (0, stat.S_IFREG, stat.S_IFDIR))
                      require(mode == 0 or (mode == stat.S_IFDIR) == entry.is_dir())
                      require(not (entry.external_attr & 0x400) and not (entry.flag_bits & 1))
                      require(entry.file_size <= 512 * MiB)
                      total += entry.file_size
                      require(total <= 1024 * MiB)
                      if not entry.is_dir():
                          files.add(lower)
                  for n in names:
                      p = n.split('/')
                      require(not any('/'.join(p[:i]) in files for i in range(1, len(p))))
                  # Verified regular files only. Do not apply archive ACL/link metadata.
                  stage = 'llvm-zip-stream-copy'
                  for entry in entries:
                      seconds_left()
                      n = safe_member(entry.filename)
                      out = tools.joinpath(*n.split('/'))
                      require(out.is_relative_to(tools) and len(str(out)) <= 240)
                      out.parent.mkdir(parents=True, exist_ok=True)
                      if entry.is_dir():
                          out.mkdir(exist_ok=True)
                          normal_object(out)
                          continue
                      with z.open(entry) as source, out.open('xb') as dest:
                          copied = 0
                          while True:
                              seconds_left()
                              piece = source.read(MiB)
                              if not piece:
                                  break
                              require(copied + len(piece) <= entry.file_size)
                              require(dest.write(piece) == len(piece))
                              copied += len(piece)
                          require(copied == entry.file_size)
                      normal_object(out)

              stage = 'sdk-7z-member-preflight'
              listing = cmd([seven, 'l', '-slt', '-ba', '-sccUTF-8', '-bd', '-bsp0', '--', sdk],
                            child_env, timeout=90, cap=16 * MiB).decode('utf-8-sig')
              records = {}
              for block in re.split(r'\r?\n\s*\r?\n', listing.strip()):
                  fields = {}
                  for line in block.splitlines():
                      k, sep, v = line.partition(' = ')
                      require(sep and k not in fields)
                      fields[k] = v
                  name = safe_member(fields['Path'].replace('\\', '/'))
                  key = name.casefold()
                  require(key not in records)
                  require(not any('link' in k.lower() or 'reparse' in k.lower() for k in fields))
                  attr = fields.get('Attributes', '').upper()
                  require('L' not in attr and fields.get('Encrypted', '-') == '-')
                  size = int(fields.get('Size', '0'))
                  require(0 <= size <= 512 * MiB)
                  isdir = fields.get('Folder') == '+' or attr.startswith('D')
                  records[key] = (name, size, isdir)
              require(len(records) == 231)
              require(sum(v[1] for v in records.values()) == 272363958)
              filepaths = {k for k, v in records.items() if not v[2]}
              for k in records:
                  parts = k.split('/')
                  require(not any('/'.join(parts[:i]) in filepaths for i in range(1, len(parts))))
              require(sdk_folder.casefold() in records and records[sdk_folder.casefold()][2])

              # This is a disposable public-repo GitHub Windows VM, NOT a D3
              # trusted-media runtime. With a publisher-hash-pinned, screened archive,
              # use one 7z x call rather than >130 repeat LZMA2 decodes.
              stage = 'sdk-one-pass-extraction'
              sdktree = root / 'sdk'
              sdktree.mkdir()
              cmd([seven, 'x', '-y', '-bd', '-bso0', '-bse0', '-bsp0',
                   '-o' + str(sdktree), '--', sdk],
                  child_env, timeout=260, cap=256 * 1024)

              stage = 'post-extraction-member-closure'
              observed = set()
              for path in sdktree.rglob('*'):
                  seconds_left()
                  normal_object(path)
                  rel = safe_member(path.relative_to(sdktree).as_posix())
                  key = rel.casefold()
                  require(key in records and key not in observed)
                  name, size, directory = records[key]
                  require(path.is_dir() if directory else path.is_file())
                  if not directory:
                      require(path.stat().st_size == size)
                  observed.add(key)
              require(observed == set(records))
              ffroot = sdktree / sdk_folder
              for rel, digest in pins.items():
                  path = ffroot.joinpath(*rel.split('/'))
                  normal_object(path)
                  require(path.is_file())
                  require(hashlib.sha256(path.read_bytes()).hexdigest().upper() == digest)

              stage = 'compiler-preflight'
              compilerbin = tools / llvm_folder / 'bin'
              clang = compilerbin / 'x86_64-w64-mingw32-clang.exe'
              readobj = compilerbin / 'llvm-readobj.exe'
              for path in (clang, readobj):
                  normal_object(path)
                  require(path.is_file())
              child_env['PATH'] = str(compilerbin) + os.pathsep + str(Path(os.environ['SystemRoot']) / 'System32')

              stage = 'synthetic-C-compile-and-link'
              source_bytes = (
                  '#include <libavformat/avio.h>\n'
                  '#include <libavcodec/avcodec.h>\n'
                  'static __typeof__(&avio_alloc_context) volatile keep_a = &avio_alloc_context;\n'
                  'static __typeof__(&avcodec_send_packet) volatile keep_b = &avcodec_send_packet;\n'
                  'int main(void) { return (keep_a == 0) || (keep_b == 0); }\n'
              ).encode('ascii')
              source = root / 'probe.c'
              with source.open('xb') as out:
                  require(out.write(source_bytes) == len(source_bytes))
              exe = root / 'probe.exe'
              require(not exe.exists())
              cmd([clang, '-std=gnu17', '-O0', '-fno-lto', '-fuse-ld=lld', '-Werror',
                   '-I', ffroot / 'include', source,
                   ffroot / 'lib' / 'libavformat.dll.a',
                   ffroot / 'lib' / 'libavcodec.dll.a', '-o', exe],
                  child_env, timeout=180)

              stage = 'static-PE-inspection'
              normal_object(exe)
              require(exe.is_file() and 0 < exe.stat().st_size <= 32 * MiB)
              data = exe.read_bytes()
              require(data[:2] == b'MZ' and len(data) >= 64)
              off = struct.unpack_from('<I', data, 0x3c)[0]
              require(off + 26 <= len(data) and data[off:off + 4] == b'PE\0\0')
              require(struct.unpack_from('<H', data, off + 4)[0] == 0x8664)
              require(struct.unpack_from('<H', data, off + 24)[0] == 0x20b)
              listing = cmd([readobj, '--file-headers', '--coff-imports', exe],
                            child_env, timeout=30, cap=8 * MiB).decode('utf-8')
              sections, group = [], None
              for line in listing.splitlines():
                  if line.strip() == 'Import {':
                      require(group is None)
                      group = []
                  elif group is not None and line.strip() == '}':
                      sections.append('\n'.join(group))
                      group = None
                  elif group is not None:
                      group.append(line)
              require(group is None)
              for dll, sym in (('avformat', 'avio_alloc_context'),
                               ('avcodec', 'avcodec_send_packet')):
                  require(any(
                      re.search(r'(?mi)^\s*Name:\s*' + dll + r'-[0-9]+\.dll\s*$', x) and
                      re.search(r'(?m)^\s*Symbol:\s*' + sym + r'(?:\s|\()', x)
                      for x in sections
                  ))
              print('GATE=PASS_MINIMAL_COMPILE_LINK_PE_IMPORTS_ONLY')
              print('SOURCE_SHA256=' + hashlib.sha256(source_bytes).hexdigest().upper())
              print('EXE_SHA256=' + hashlib.sha256(data).hexdigest().upper())
              print('TARGET=WINDOWS_AMD64;LIBAV_IMPORTS=2')
              print('GENERATED_EXE_EXECUTIONS=0;MEDIA_EXECUTIONS=0;ARTIFACTS_UPLOADED=0')
          except Exception as exc:
              # Public logs expose no command lines, local paths, environment or secrets.
              print('GATE=STOP;STAGE=' + stage + ';ERROR_CLASS=' + type(exc).__name__ + ';PROCESS=' + last_process_status)
              sys.exit(1)
